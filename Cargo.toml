[package]
name = "claviron-chat"
version = "0.2.0-alpha.16"
edition = "2024"
authors = ["ilker Arabaci <iadeveloper@hotmail.com>"]
# Pre-releases go to the de02 registry only, in step with claviron's version.
publish = ["de02"]
# The JavaScript client is built and shipped on its own.
exclude = ["client/", ".idea/"]
description = "Chat transports for a Claviron edge: WebSocket upgrade, HTTP/2 CONNECT, WebTransport, and a QUIC prototype."
autotests = false

# A service an edge binary takes as a direct dependency, beside the
# `claviron` facade. It consumes the facade only, never the internal
# `claviron-*` crates, and registers its providers through `claviron-chat::register`.

[features]
default = []
quic = [
    "dep:quinn",
    "dep:h3",
    "dep:h3-quinn",
]
webtransport = [
    "dep:h3-webtransport",
    "dep:h3-quinn",
    "claviron/webtransport",
]
metrics = []

[dependencies]
claviron = { path = "../claviron", default-features = false, features = [
    "auth",
    "server",
    "edge",
    "hosting", # tls + db
    "cache",
    "postgres", # chat.* tables and DbService's claviron pool live on PostgreSQL
    "websocket", # HTTP/1.1 Upgrade and extended CONNECT
] }

async-trait = "0.1"
arc-swap = "1.9"
axum = "0.8"
bytes = "1.11"
fastwebsockets = "0.10"
futures-util = "0.3"
http = "1"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["server", "http2", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http2", "http1"] }
moka = { version = "0.12", features = ["sync"] }
once_cell = "1.21"
regex = "1.12"
rmp-serde = "1.3"
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "aws_lc_rs"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time"] }
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
urlencoding = "2.1"
uuid = { version = "1.26", features = ["serde", "v4"] }

# The same h3 fork family as claviron, so the types are shared.
h3 = { package = "h3-forked", version = "0.0.1", optional = true }
h3-quinn = { package = "h3-quinn-forked", version = "0.0.1", optional = true }
h3-webtransport = { package = "h3-webtransport-forked", version = "0.0.1", optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"], optional = true }
